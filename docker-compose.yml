services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-task_manager}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-task_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODELS_DIR: /app/models
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
    volumes:
      - ./models:/app/models
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-task_manager}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-180}
      THROTTLE_AUTH_TTL: ${THROTTLE_AUTH_TTL:-60000}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_IDLE_TIMEOUT: ${DB_POOL_IDLE_TIMEOUT:-30000}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_SEED: ${AUTO_SEED:-false}
      RISK_PROVIDER: ${RISK_PROVIDER:-ml}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
    ports:
      - "${PORT:-3000}:3000"  
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - app-network

  postgres-e2e:
    profiles: ["e2e"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${E2E_DB_NAME:-task_manager_e2e}
      POSTGRES_USER: ${E2E_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-postgres}
    ports:
      - "${E2E_DB_PORT:-5434}:5432"
    volumes:
      - pgdata_e2e:/var/lib/postgresql/data
    networks:
      - app-network-e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${E2E_DB_USERNAME:-postgres} -d ${E2E_DB_NAME:-task_manager_e2e}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-e2e:
    profiles: ["e2e"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${E2E_NODE_ENV:-test}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${E2E_DB_USERNAME:-postgres}:${E2E_DB_PASSWORD:-postgres}@postgres-e2e:5432/${E2E_DB_NAME:-task_manager_e2e}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-180}
      THROTTLE_AUTH_TTL: ${THROTTLE_AUTH_TTL:-60000}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CORS_ORIGIN: ${E2E_CORS_ORIGIN:-http://localhost:5174,http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_SEED: ${E2E_AUTO_SEED:-false}
      SEED_COMMAND: ${E2E_SEED_COMMAND:-npm run db:seed:e2e}
    ports:
      - "${E2E_BACKEND_PORT:-3001}:3000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    depends_on:
      postgres-e2e:
        condition: service_healthy
    networks:
      app-network-e2e:
        aliases:
          - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend-e2e:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${E2E_FRONTEND_PORT:-5174}:80"
    depends_on:
      backend-e2e:
        condition: service_healthy
    networks:
      - app-network-e2e

volumes:
  pgdata:
    driver: local
  pgdata_e2e:
    driver: local

networks:
  app-network:
    driver: bridge
  app-network-e2e:
    driver: bridge
