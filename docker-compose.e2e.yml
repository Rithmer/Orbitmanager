services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: taskmanager-db-e2e
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${E2E_DB_NAME:-task_manager_e2e}
      POSTGRES_USER: ${E2E_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-postgres}
    ports:
      - "${E2E_DB_PORT:-5434}:5432"
    volumes:
      - pgdata_e2e:/var/lib/postgresql/data
    networks:
      - app-network-e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${E2E_DB_USERNAME:-postgres} -d ${E2E_DB_NAME:-task_manager_e2e}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager-api-e2e
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${E2E_NODE_ENV:-test}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      DATABASE_URL: postgresql://${E2E_DB_USERNAME:-postgres}:${E2E_DB_PASSWORD:-postgres}@postgres-e2e:5432/${E2E_DB_NAME:-task_manager_e2e}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      CORS_ORIGIN: ${E2E_CORS_ORIGIN:-http://localhost:5174,http://localhost:3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTO_SEED: ${E2E_AUTO_SEED:-true}
      SEED_COMMAND: ${E2E_SEED_COMMAND:-npm run db:seed:e2e}
    ports:
      - "${E2E_BACKEND_PORT:-3001}:3000"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    depends_on:
      postgres-e2e:
        condition: service_healthy
    networks:
      app-network-e2e:
        aliases:
          - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager-frontend-e2e
    restart: unless-stopped
    ports:
      - "${E2E_FRONTEND_PORT:-5174}:80"
    depends_on:
      backend-e2e:
        condition: service_healthy
    networks:
      - app-network-e2e

volumes:
  pgdata_e2e:
    driver: local

networks:
  app-network-e2e:
    driver: bridge
